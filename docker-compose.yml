services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    ports:
      - '5000:5000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm run db:generate && npm run dev -- --hostname 0.0.0.0 --port 5000"
